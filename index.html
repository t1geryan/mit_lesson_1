<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Первая работа</title>

    <style>
        .header {
            color: olive;
            font-size: 48px;
            padding: 20px 40px;
        }

        .top-right {
            position: fixed;
            top: 0;
            right: 0;
        }
        
        p {
            font-size: 30px;
        }
    </style>
</head>

<body>
    <h1 class="header top-right">Заголовок</h1>

    <p>Hello World!</p>

    <a href="./index.html">Ссылка на эту страницу</a>

    <div id="number" class="header">0</div>

    <img
        src="https://picsum.photos/300/300"
        alt="Случайное изображение"
    >

    <br><br>

    <button id="button">Остановить</button>

    <label>
        <input type="text" placeholder="Введите текст">
    </label>

    <script>
        let value = 0
        let interval = null

        const number = document.getElementById('number')
        const button = document.getElementById('button')

        function startCounter() {
            interval = setInterval(() => {
                value++
                number.textContent = value
            }, 500)
        }

        startCounter()

        button.addEventListener('click', () => {
            if (interval) {
                clearInterval(interval)
                interval = null
                button.textContent = 'Продолжить'
            } else {
                startCounter()
                button.textContent = 'Остановить'
            }
        })
    </script>
</body>
</html>
